# Optional: include INSIDE the HTTPS server block for www.hgelectrons.com only.
# Do not include at http scope or in course.conf. Not part of the first rollout.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_types application/javascript text/css application/json image/svg+xml;

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
